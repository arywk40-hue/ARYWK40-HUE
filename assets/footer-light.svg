<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-labelledby="title">
  <title id="title">build, break, understand, rebuild — WEAVER</title>
  <style>
    .m{font:600 26px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
    .s{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e;letter-spacing:5px}
    .arr{fill:#0891b2}
    .w{fill-opacity:0;animation:in 8s infinite}
    @keyframes in{0%{fill-opacity:0}6%,80%{fill-opacity:1}92%,100%{fill-opacity:0}}
    @media (prefers-reduced-motion:reduce){.w{animation:none;fill-opacity:1}}
  </style>
  <rect x="0.5" y="0.5" width="1279" height="149" rx="18" fill="#ffffff" stroke="#d8dee8"/>
  <text x="640.0" y="72" text-anchor="middle" class="m">
    <tspan class="w" style="animation-delay:0s">build</tspan><tspan class="arr w" style="animation-delay:.4s"> → </tspan><tspan class="w" style="animation-delay:.8s">break</tspan><tspan class="arr w" style="animation-delay:1.2s"> → </tspan><tspan class="w" style="animation-delay:1.6s">understand</tspan><tspan class="arr w" style="animation-delay:2s"> → </tspan><tspan class="w" style="animation-delay:2.4s" fill="#7c3aed">rebuild</tspan>
  </text>
  <text x="640.0" y="112" text-anchor="middle" class="s">— WEAVER —</text>
</svg>
