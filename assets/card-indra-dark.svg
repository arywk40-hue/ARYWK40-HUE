<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">INDRA: Weather and hazard forecasting that runs on the sensor node itself.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <style>
    .lab{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#a78bfa}
    .name{font:800 54px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1px;fill:#e6edf3}
    .tag{font:500 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8b949e}
    .mv{font:700 30px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6edf3}
    .ml{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8b949e}
    .step{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6edf3}
    .idx{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e;letter-spacing:1px}
    .link{stroke:#8b949e;stroke-opacity:.5;stroke-width:1.5}
    .pulse{fill:#a78bfa;animation:run 4.5s linear infinite}
    @keyframes run{from{transform:translateY(0)}to{transform:translateY(328px)}}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="url(#bg)" stroke="#1f2a3c"/>
  <rect x="64" y="0" width="120" height="4" rx="2" fill="#a78bfa"/>
  <text class="lab" x="64" y="70">01 · EDGE ML · SOLO</text>
  <text class="name" x="62" y="132">INDRA</text>
  <text class="tag" x="64" y="176">Weather and hazard forecasting that runs</text><text class="tag" x="64" y="206">on the sensor node itself.</text>
  <text class="mv" x="64" y="262">1.14 °C</text><text class="ml" x="64" y="288">+6 h forecast MAE</text><text class="mv" x="334" y="262">50–83%</text><text class="ml" x="334" y="288">skill over persistence</text><text class="mv" x="64" y="340">2.96 MB</text><text class="ml" x="64" y="366">firmware + model on ESP32-S3</text><text class="mv" x="334" y="340">402</text><text class="ml" x="334" y="366">tests passing</text>
  <line x1="738" y1="100" x2="738" y2="122" class="link"/><line x1="738" y1="170" x2="738" y2="192" class="link"/><line x1="738" y1="240" x2="738" y2="262" class="link"/><line x1="738" y1="310" x2="738" y2="332" class="link"/>
  <circle class="pulse" cx="738" cy="52" r="4"/>
  <rect x="690" y="52" width="526" height="48" rx="10" fill="#0f1624" stroke="#1f2a3c" stroke-width="1"/><text class="step" x="712" y="82">BME280 · PMS7003 sensor nodes</text><text class="idx" x="1196" y="82" text-anchor="end">01</text><rect x="690" y="122" width="526" height="48" rx="10" fill="#0f1624" stroke="#1f2a3c" stroke-width="1"/><text class="step" x="712" y="152">C++ forecaster on the ESP32-S3</text><text class="idx" x="1196" y="152" text-anchor="end">02</text><rect x="690" y="192" width="526" height="48" rx="10" fill="#0f1624" stroke="#1f2a3c" stroke-width="1"/><text class="step" x="712" y="222">ESP-NOW / LoRa mesh, HMAC-signed</text><text class="idx" x="1196" y="222" text-anchor="end">03</text><rect x="690" y="262" width="526" height="48" rx="10" fill="#0f1624" stroke="#1f2a3c" stroke-width="1"/><text class="step" x="712" y="292">Gateway + FastAPI ingestion</text><text class="idx" x="1196" y="292" text-anchor="end">04</text><rect x="690" y="332" width="526" height="48" rx="10" fill="#0f1624" stroke="#a78bfa" stroke-width="1.6"/><text class="step" x="712" y="362">Dashboard with six-hour outlook</text><text class="idx" x="1196" y="362" text-anchor="end">05</text>
</svg>
