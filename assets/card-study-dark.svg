<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">Study Companion: A course tutor that checks every claim with a second model and cites the exact source.</title>
